<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page paint into the display cutout and
         home-indicator areas, which is what a full-bleed canvas wants. It is
         also what ARMS `env(safe-area-inset-*)`: without it those all report 0
         and the mobile control bar would sit under the home indicator. The two
         go together -- see `#fluoddity-mobile-bar` in `mutationOverlay.ts`.

         `maximum-scale`/`user-scalable=no` are deliberately ABSENT. Pinch-zoom
         on the PAGE is suppressed by `touch-action` on the canvas (below), which
         is scoped to the element that handles its own gestures; disabling it
         document-wide would also block the browser's accessibility zoom, which
         is a real assistive feature and not ours to take away. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Favicon paths are RELATIVE, matching `base: './'` in vite.config.ts:
         GitHub Pages serves this app from a subpath, so a leading-slash href
         would resolve against the domain root and 404.

         The manifest deliberately omits `display`. With it, mobile Chrome
         meets its installability bar and nags with an "Install Fluoddity"
         banner. Favicon generators emit `"display": "standalone"` by default,
         so drop it again after any regeneration. -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <title>Fluoddity</title>

    <!-- Link-preview card, for when the URL is pasted into Discord, Slack,
         iMessage, X and the rest.

         **THESE URLS ARE ABSOLUTE, AND THAT IS NOT AN OVERSIGHT.** Every other
         asset on this page is relative to match `base: './'` in vite.config.ts
         (see the favicon note above), but Open Graph is the one exception:
         scrapers fetch the image out-of-band, with no document base to resolve
         against, so `./image_card.png` is either ignored or fetched from the
         scraper's own host. It has to name the origin.

         The cost of hardcoding it is that this is now the ONE place in the
         project that knows where the app is deployed -- the app itself is
         location-independent, and the share link builds from the live
         `location` rather than from a constant. If the domain ever moves, this
         block is what has to move with it; nothing else here will break.

         `og:image:secure_url` alongside `og:image`: some scrapers still read
         only the former over HTTPS. Same file, and cheap insurance.

         `og:description` is PLACEHOLDER TEXT -- swap the lorem ipsum below for
         real copy before this matters. Scrapers cache aggressively, so whatever
         is here when a link is first pasted can outlive the edit that fixes it.
         Keep it under ~200 characters: Discord and Slack truncate past roughly
         that, and X shows less still.

         No `twitter:description` -- Twitter falls back to `og:description`, so
         a second copy would only be one more place to forget to update.

         `twitter:card` is `summary_large_image` so the art gets the full width
         rather than a thumbnail beside text that is not there. Twitter falls
         back to the `og:` tags for everything else, so they are not repeated. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fluoddity" />
    <meta property="og:title" content="Fluoddity" />
    <!-- TODO: replace with the real description. -->
    <meta
      property="og:description"
      content="An interactive lava lamp? An evolvable ant farm? Explore a world very different from our own."
    />
    <meta property="og:url" content="https://fluoddity.com/" />
    <meta property="og:image" content="https://fluoddity.com/image_card.png" />
    <meta
      property="og:image:secure_url"
      content="https://fluoddity.com/image_card.png"
    />
    <meta property="og:image:alt" content="Fluoddity" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fluoddity" />
    <meta name="twitter:image" content="https://fluoddity.com/image_card.png" />
    <style>
      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        padding: 0;
        /* `100%` FIRST, THEN `100dvh` -- the order is the fallback chain, and a
           browser too old for `dvh` simply keeps the first declaration.

           On mobile, `100vh` is the viewport with the URL bar RETRACTED, which
           is taller than what is actually visible when the bar is showing. A
           bottom-anchored control bar measured against it starts life underneath
           the browser chrome. `dvh` is the DYNAMIC viewport height: it tracks
           the visible area as the URL bar collapses and expands, which is
           exactly the quantity a full-screen app wants.

           This costs desktop nothing -- there `dvh` and `vh` are the same
           number, because there is no retracting chrome. */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }

      /* The canvas fills the viewport in CSS pixels; its backing store is sized
         in device pixels by src/app/surface.ts. The two are not the same thing
         and must not be conflated -- see that file's header.

         `touch-action: none` IS LOAD-BEARING ON TOUCH, not a nicety. By default
         the browser claims one-finger drags for scrolling and two-finger for
         page zoom, and it does so by CANCELLING the pointer stream mid-gesture
         -- so every pan, pinch and draw stroke would die partway through as a
         `pointercancel`. Taking the gestures here is what lets
         `touchGestures.ts` interpret them instead.

         Scoped to the canvas ALONE. The panels must keep their native
         scrolling, which is why this is not on `body`.

         It also removes the ~300ms click delay that browsers hold taps for
         while waiting to see a double-tap-to-zoom. */
      #app {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #gpu-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        padding: 2rem;
        text-align: center;
        font: 16px/1.5 system-ui, sans-serif;
        color: #eee;
        background: #1a1a1a;
      }

      #gpu-error h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
      #gpu-error p  { margin: 0; max-width: 44rem; color: #bbb; }

      /* ===================================================================
         TOUCH: long-press must not select text or raise the callout menu.
         ===================================================================

         Applied only under `.fluoddity-touch`, which `main.ts` puts on <html>
         when the touch layout is resolved. **DESKTOP NEVER MATCHES THIS
         BLOCK** -- the class is absent there, so every rule below is inert and
         requirement B holds by construction rather than by review.

         Long-press is how a touch user reaches a tooltip (`tooltip.ts`) and the
         canvas context action. The OS reads the same gesture as "select this
         word / show me a callout", so without this a user asking for help gets
         a blue selection highlight and a Copy/Look Up bubble on top of the
         thing they were trying to read. Both halves are needed: `user-select`
         kills the highlight, `-webkit-touch-callout` kills the iOS bubble.

         `input`/`textarea` ARE EXEMPTED, and the exemption is the reason this
         is scoped rather than global. Suppressing selection there would make
         every text field in the panel impossible to edit -- no caret placement,
         no selecting a value to overwrite it. The `user-select: text` below is
         what hands those two elements their normal behaviour back. */
      .fluoddity-touch,
      .fluoddity-touch body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        /* Stops iOS inflating font sizes in landscape, which would silently
           break every hand-tuned px dimension in the mobile bar. */
        -webkit-text-size-adjust: 100%;
      }

      .fluoddity-touch input,
      .fluoddity-touch textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Removes the grey flash the browser paints over a tapped element. The
         app draws its own press feedback, and the default rectangle ignores
         border-radius, so it reads as a rendering glitch on rounded buttons. */
      .fluoddity-touch * {
        -webkit-tap-highlight-color: transparent;
      }

      /* ===================================================================
         TOUCH: blade labels sit BESIDE their controls, not an ocean away.
         ===================================================================

         The touch panel is ONE sheet spanning the whole viewport
         (`sideContainer` in `ui/panel.ts`), where the desktop has two fixed
         320px columns.

         **THE LABEL IS THE CELL THAT STRETCHES, and that is the whole cause.**
         A blade is a flex row of two cells: the value cell is FIXED width
         (`tp-lblv_v` is `flex-grow:0; width:var(--bld-vw)`) and the label takes
         everything left over (`flex:1`). So as the row gets wider the control
         stays put against the right edge and the label cell grows -- with the
         text still hard against its own left edge. At 320px that gap is small
         enough to read across; on a tablet, or any phone in landscape, a name
         and the slider it names end up several hundred pixels apart, and
         working out which control belongs to which row means tracking across
         all of it.

         Right-justifying the text moves it to the end of the cell that grew,
         so it sits against its control at every width. Nothing else moves --
         the growing cell is the only thing that was ever the problem.

         **THE LABEL CELL, NOT THE ROW.** `text-align` on the blade itself
         would inherit into the value cell, which is where the sliders, number
         boxes and text inputs live.

         **NO PADDING CHANGE.** Tweakpane already gives this cell
         `padding-right:16px`, which becomes the gap between the name and the
         control the moment the text moves right -- adding to it would push the
         label away from the control it was just brought next to, and reducing
         it would let the last character butt against the widget.

         DESKTOP IS UNAFFECTED, by the `.fluoddity-touch` scoping every rule in
         this block uses -- the class is only ever on <html> in the touch
         layout, so the 320px columns keep the alignment they were tuned for.

         `tp-*` class names are Tweakpane's own and are NOT minified -- the same
         literal structure `ui/perfLabels.ts` documents and walks. Its warning
         about not matching on them applies to JS reaching into blade internals,
         which is more fragile than styling the two cells the library has always
         laid a blade out in. If a future Tweakpane renames them this rule
         silently stops applying, which costs the alignment and nothing else. */
      .fluoddity-touch .tp-lblv_l {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
