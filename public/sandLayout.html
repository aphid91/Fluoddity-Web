<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sand Layout Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  /* ====================================================================
     THE BENCH (the page around the mock). Theme-aware.
     ==================================================================== */
  :root {
    color-scheme: light;
    --bg: #e8ebee;
    --panel: #f7f8f9;
    --panel-2: #eceff2;
    --ink: #1c2228;
    --dim: #5d6873;
    --line: #d2d8de;
    --accent: #a5601a;
    --accent-ink: #ffffff;
    --warn: #b93a22;
    --warn-bg: #f7e3dd;
    --ok: #2c7a4b;
    --ok-bg: #dcefe3;
    --chg: #2a5fa8;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111417;
      --panel: #171b1f;
      --panel-2: #1f2428;
      --ink: #e1e5e9;
      --dim: #8b96a1;
      --line: #2b3238;
      --accent: #e0a458;
      --accent-ink: #1b1206;
      --warn: #ff8266;
      --warn-bg: #3a1d16;
      --ok: #72c894;
      --ok-bg: #16301f;
      --chg: #8db8f0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111417;
    --panel: #171b1f;
    --panel-2: #1f2428;
    --ink: #e1e5e9;
    --dim: #8b96a1;
    --line: #2b3238;
    --accent: #e0a458;
    --accent-ink: #1b1206;
    --warn: #ff8266;
    --warn-bg: #3a1d16;
    --ok: #72c894;
    --ok-bg: #16301f;
    --chg: #8db8f0;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 var(--sans);
  }

  .shell {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    height: 100%;
  }
  .controls {
    overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 16px;
    box-sizing: border-box;
  }
  .main {
    overflow: auto;
    padding: 16px;
    min-width: 0;
  }

  .ctl-head h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .ctl-head p {
    margin: 0 0 12px;
    color: var(--dim);
    font-size: 13px;
  }

  details.group {
    border-top: 1px solid var(--line);
    padding: 8px 0;
  }
  details.group > summary {
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 4px 0;
    list-style-position: inside;
  }
  .rows { display: grid; gap: 8px; padding-top: 6px; }
  .row {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr) 44px;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .row .rl { color: var(--ink); }
  /* Differs from the app's value: Reset everything puts it back. */
  .row[data-changed="true"] .rl { color: var(--chg); font-weight: 500; }
  .row[data-changed="true"] .rl::after { content: " •"; }
  .row output {
    font: 12px var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    text-align: right;
  }
  .row input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .row.seg-row { grid-template-columns: 112px minmax(0, 1fr); }
  .row.chk { display: flex; gap: 8px; cursor: pointer; }
  .row.chk input { accent-color: var(--accent); margin: 0; }
  .row select {
    grid-column: 2 / 4;
    font: inherit;
    padding: 4px 6px;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
    background: var(--panel-2);
  }
  .seg button {
    flex: 1 1 0;
    min-width: 0;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 12px var(--sans);
    padding: 5px 4px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
  }
  .note {
    font-size: 12px;
    color: var(--dim);
    margin: 0;
  }
  .btn {
    appearance: none;
    font: 13px var(--sans);
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea.export {
    width: 100%;
    box-sizing: border-box;
    height: 220px;
    font: 11px/1.4 var(--mono);
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    resize: vertical;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- the gallery ---------------------------------------------------- */
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 24px 20px;
    align-items: flex-start;
  }
  .card { margin: 0; display: grid; gap: 8px; max-width: 100%; }
  .card header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card header b { font-weight: 600; font-size: 14px; }
  .card header span { color: var(--dim); font: 12px var(--mono); }
  .card header .btn { margin-left: auto; padding: 2px 10px; font-size: 12px; }
  .pv {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #000;
    max-width: 100%;
  }
  .pv.touch { border-radius: 14px; border-width: 3px; border-color: var(--ink); }
  .pv > .app { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 11.5px/1.3 var(--mono);
    font-variant-numeric: tabular-nums;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--panel-2);
    color: var(--dim);
  }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }

  /* --- this-screen view ------------------------------------------------ */
  .live { display: none; position: fixed; inset: 0; z-index: 40; background: #000; }
  .live > .app { position: absolute; top: 0; left: 0; }
  .ctl-toggle {
    display: none;
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    z-index: 60;
    opacity: 0.9;
  }
  body[data-view="live"] .live,
  body[data-view="live"] .ctl-toggle { display: block; }
  body[data-view="live"] .main { display: none; }
  body[data-view="live"] .controls {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(340px, 92vw);
    z-index: 55;
    border-left: 1px solid var(--line);
    box-shadow: -12px 0 40px rgba(0, 0, 0, 0.35);
    transform: translateX(105%);
    transition: transform 0.2s ease;
    padding-top: calc(env(safe-area-inset-top, 0px) + 48px);
  }
  body[data-view="live"].ctl-open .controls { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    body[data-view="live"] .controls { transition: none; }
  }

  @media (max-width: 760px) {
    html, body { height: auto; }
    .shell { display: block; height: auto; }
    .controls { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  /* ====================================================================
     THE MOCK: sand.html's layout, transcribed. Every size is a unitless
     CSS-px token (the same names as sand.html's :root) times a unit:
       --u    the stage and the swatch bar: --ui px
       --us   the sidebar: --ui x --side-fit px (Sidebar too tall: Scale
              down; 1 otherwise, which is what the app does)
     --ui is set per instance, because the scale-up is per screen.
     ==================================================================== */
  .app {
    --st: 0px; --sr: 0px; --sb: 0px; --sl: 0px;
    --side-fit: 1;
    --u: calc(var(--ui) * 1px);
    --us: calc(var(--ui) * var(--side-fit) * 1px);
    --r: calc(var(--corner) * var(--rmul) * var(--u));
    --rs: calc(var(--corner) * var(--rmul) * var(--us));
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
    display: grid;
    gap: calc(var(--pad) * var(--u));
    padding:
      calc(var(--st) + var(--pad) * var(--u))
      calc(var(--sr) + var(--pad) * var(--u))
      calc(var(--sb) + var(--pad) * var(--u))
      calc(var(--sl) + var(--pad) * var(--u));
    background: var(--m-bg);
    color: var(--m-ink);
    font-family: var(--m-font);
    font-size: calc(11 * var(--u));
    line-height: 1.25;
    text-align: left;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Looks: sand.html's three, token for token (theme.ts). */
  .app[data-skin="darkroom"] {
    --m-bg: #0b0c0f; --m-chrome: #16181d; --m-chrome2: #1d2027; --m-edge: #2a2e37;
    --m-ink: #d6d9e0; --m-dim: #767c8a; --m-accent: #e8a33d; --m-accent-ink: #1a1305;
    --m-selbg: #2a2118; --m-selink: #f0c078; --m-seledge: #e8a33d;
    --m-bw: 1px; --m-cedge: #2a2e37; --rmul: 1;
    --m-font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --m-lspace: 0.06em; --m-lcase: uppercase;
    --m-icline: #e8a33d; --m-icink: #f0c078; --m-icbg: rgba(11, 12, 15, 0.86);
  }
  .app[data-skin="system7"] {
    --m-bg: #5f5f5f; --m-chrome: #ffffff; --m-chrome2: #ffffff; --m-edge: #000000;
    --m-ink: #000000; --m-dim: #6b6b6b; --m-accent: #000000; --m-accent-ink: #ffffff;
    --m-selbg: #000000; --m-selink: #ffffff; --m-seledge: #000000;
    --m-bw: 2px; --m-cedge: #000000; --rmul: 0;
    --m-font: ui-monospace, "Chicago", "Geneva", Monaco, monospace;
    --m-lspace: 0.02em; --m-lcase: none;
    --m-icline: #ffffff; --m-icink: #ffffff; --m-icbg: rgba(0, 0, 0, 0.72);
  }
  .app[data-skin="blueprint"] {
    --m-bg: #0a1020; --m-chrome: #121a2e; --m-chrome2: #18223a; --m-edge: #2d4468;
    --m-ink: #c4d6ec; --m-dim: #6d86a8; --m-accent: #7fd4e8; --m-accent-ink: #06222c;
    --m-selbg: #123040; --m-selink: #a8e8f6; --m-seledge: #7fd4e8;
    --m-bw: 1px; --m-cedge: #2d4468; --rmul: 1;
    --m-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --m-lspace: 0.1em; --m-lcase: uppercase;
    --m-icline: #7fd4e8; --m-icink: #a8e8f6; --m-icbg: rgba(10, 16, 32, 0.86);
  }

  /* --- the plans: sidebar (landscape) and band (portrait) are the app's;
     drawer is an experiment the app does not have. ------------------- */
  .app[data-plan="sidebar"] {
    grid-template-columns: calc(var(--side-w) * var(--us)) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "side stage" "bar bar";
  }
  .app[data-plan="band"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto auto;
    grid-template-areas: "stage" "side" "bar";
  }
  .app[data-plan="drawer"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "stage" "bar";
  }

  /* --- stage and canvas ---------------------------------------------- */
  .stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
  .canvas {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    overflow: hidden;
    border: var(--m-bw) solid var(--m-cedge);
    background:
      radial-gradient(ellipse 18% 14% at 28% 38%, rgba(232, 163, 61, 0.34), transparent 70%),
      radial-gradient(ellipse 13% 19% at 64% 58%, rgba(95, 176, 232, 0.28), transparent 70%),
      radial-gradient(ellipse 10% 9% at 79% 27%, rgba(208, 96, 94, 0.26), transparent 70%),
      radial-gradient(ellipse 9% 11% at 40% 74%, rgba(124, 194, 122, 0.22), transparent 70%),
      #000;
  }
  .app[data-ic="editing"] .canvas { outline: 2px dashed var(--m-icline); outline-offset: -6px; }
  .dims {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font: calc(12 * var(--u)) / 1.3 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    white-space: nowrap;
  }
  .dims small { display: block; color: rgba(255, 255, 255, 0.38); font-size: 0.85em; }
  .status, .icb, .icset {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 92%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-radius: var(--r);
    pointer-events: none;
  }
  .status {
    bottom: calc(8 * var(--u));
    padding: calc(2 * var(--u)) calc(8 * var(--u));
    background: var(--m-icbg);
    color: var(--m-dim);
    font-size: calc(11 * var(--u));
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }
  .icb, .icset {
    top: calc(14 * var(--u));
    padding: calc(6 * var(--u)) calc(16 * var(--u));
    background: var(--m-icbg);
    color: var(--m-icink);
    border: var(--m-bw) solid var(--m-icline);
    font-family: var(--m-font);
    font-size: calc(10 * var(--u));
    letter-spacing: var(--m-lspace);
    text-transform: var(--m-lcase);
    display: none;
    z-index: 3;
  }
  .icset { pointer-events: auto; cursor: pointer; margin: 0; line-height: inherit; }
  .app[data-ic="editing"] .icb,
  .app[data-ic="set"] .icset { display: block; }
  .app[data-status="off"] .status { display: none; }

  /* --- the World menu, in the canvas's top-left corner ---------------- */
  .corner {
    position: absolute;
    z-index: 4;
    top: calc(8 * var(--u));
    left: calc(8 * var(--u));
    display: flex;
    align-items: flex-start;
    gap: calc(8 * var(--u));
  }
  /* The drawer experiment's handle. `.corner` outranks the generic `.b`. */
  .corner .handle {
    display: none;
    height: calc(44 * var(--u));
    padding: 0 calc(10 * var(--u));
    gap: calc(6 * var(--u));
    opacity: 0.94;
  }
  .app[data-plan="drawer"] .handle { display: flex; }
  .handle svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }

  .wpick { display: flex; flex-direction: column; align-items: flex-start; }
  /* ONE BUTTON: the face with the label and a caret tab hanging below it. */
  .wtrig {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: var(--m-ink);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.94;
  }
  .wface {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    height: calc(var(--wbtn-h) * var(--u));
    padding: 0 calc(var(--wbtn-h) * 0.4 * var(--u));
    font-size: calc(var(--wbtn-h) * 0.42 * var(--u));
    white-space: nowrap;
    background: var(--m-chrome2);
    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--r);
  }
  .wtab {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: calc(var(--wbtn-h) * 0.9 * var(--u));
    height: calc(var(--wbtn-h) * 0.45 * var(--u));
    margin-top: calc(-1 * var(--m-bw));
    background: var(--m-chrome2);
    border: var(--m-bw) solid var(--m-edge);
    border-top: 0;
    border-radius: 0 0 var(--r) var(--r);
  }
  .wtab svg {
    width: 60%;
    height: 70%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s ease;
  }
  .app[data-wmenu="open"] .wtab svg { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .wtab svg { transition: none; } }
  .wgrid {
    display: none;
    grid-template-columns: repeat(2, auto);
    gap: calc(var(--wsw-gap) * var(--u));
    margin-top: calc(8 * var(--u));
  }
  .app[data-wmenu="open"] .wgrid { display: grid; }
  .wsw {
    position: relative;
    width: calc((var(--wsw-d) + 12) * var(--u));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wswb {
    appearance: none;
    width: calc(var(--wsw-d) * var(--u));
    height: calc(var(--wsw-d) * var(--u));
    border-radius: 50%;
    padding: 0;
    margin: 0;
    background: var(--g);
    border: calc(2 * var(--u)) solid rgba(255, 255, 255, 0.28);
    cursor: pointer;
    box-sizing: border-box;
  }
  .wsw[data-sel="true"] .wswb {
    box-shadow:
      0 0 0 calc(2 * var(--u)) #000,
      0 0 0 calc(4 * var(--u)) var(--m-accent);
  }
  /* The name, ON the swatch, over a plate. */
  .wl {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: calc(var(--wsw-d) * var(--u));
    box-sizing: border-box;
    font-size: calc(var(--wsw-fs) * var(--u));
    line-height: 1.3;
    color: #ffffff;
    background: rgba(0, 0, 0, var(--wl-bg));
    padding: 0 calc(5 * var(--u));
    border-radius: calc(4 * var(--rmul) * var(--u));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }

  /* --- the sidebar (or, in the band plan, the band) ------------------ */
  .side {
    grid-area: side;
    display: flex;
    flex-direction: column;
    gap: calc(var(--pad) * var(--us));
    min-height: 0;
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .app[data-overflow="scale"] .side { overflow: hidden; }
  .app[data-plan="band"] .side { flex-direction: row; overflow: visible; align-items: stretch; }
  .app[data-plan="band"] .sec { flex: 1 1 0; min-width: 0; }
  .app[data-plan="band"] .sec.tools { flex-grow: 1.4; }

  /* Drawer (experiment): slides over the canvas from the left. */
  .app[data-plan="drawer"] .side {
    grid-area: stage;
    justify-self: start;
    align-self: stretch;
    width: calc(var(--drawer-w) * var(--us));
    max-width: 100%;
    z-index: 6;
    box-sizing: border-box;
    padding: calc(var(--pad) * var(--us));
    background: var(--m-bg);
    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--rs);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
  }
  .app[data-plan="drawer"][data-drawer="closed"] .side {
    visibility: hidden;
    transform: translateX(-110%);
  }
  .scrim { display: none; position: absolute; inset: 0; z-index: 3; background: rgba(0, 0, 0, 0.4); }
  .app[data-plan="drawer"][data-drawer="open"] .scrim { display: block; }

  .sec {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: calc(var(--btn-gap) * var(--us));
    box-sizing: border-box;
    padding: calc(var(--sec-pad) * var(--us));
    background: var(--m-chrome);
    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--rs);
  }
  .lbl {
    font-size: calc(var(--label-fs) * var(--us));
    letter-spacing: var(--m-lspace);
    text-transform: var(--m-lcase);
    color: var(--m-dim);
    white-space: nowrap;
  }
  .lbl.sub { margin-top: calc(var(--btn-gap) * var(--us)); }
  .grid {
    display: grid;
    gap: calc(var(--btn-gap) * var(--us));
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  }
  .tools .grid.t { --cols: var(--tool-cols); }
  .app[data-plan="band"] .tools .grid.t { --cols: var(--band-tool-cols); }
  .sizes { --cols: 2; }

  /* THE BAND'S SIZE SECTION: in the band the brush sizes are their own
     narrow section; in the sidebar they sit under the tools. */
  .sec.sizesec { display: none; }

  .app[data-plan="band"] .tools .sizes,
  .app[data-plan="band"] .tools .lbl.sub { display: none; }
  .sizesec .sizes {
    grid-template-columns: repeat(var(--cols), calc(var(--size-w) * var(--us)));
  }
  .app[data-sizesvert="on"] .sizesec .sizes { --cols: 1; }

  /* THE TOOL BOX: under Simulation, sidebar plan only, when it fits. */
  .sec.ctxbox { display: none; }
  .app[data-box="on"] .sec.ctxbox {
    display: flex;
    height: calc(var(--box-h) * var(--us));
  }

  .b {
    appearance: none;
    font: inherit;
    color: var(--m-ink);
    background: var(--m-chrome2);
    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--rs);
    padding: 0;
    margin: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
  }
  .b:hover:not([data-sel="true"]) { border-color: var(--m-accent); }
  .b[data-sel="true"] {
    background: var(--m-selbg);
    color: var(--m-selink);
    border-color: var(--m-seledge);
  }
  .b svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .b svg .fill { fill: currentColor; stroke: none; }

  .tool {
    height: calc(var(--tool-h) * var(--us));
    flex-direction: column;
    gap: calc(3 * var(--us));
    font-size: calc(10 * var(--us));
  }
  .tool svg { width: calc(20 * var(--us)); height: calc(20 * var(--us)); }
  .size { height: calc(var(--size-h) * var(--us)); }
  .size i {
    display: block;
    border-radius: 50%;
    background: currentColor;
    width: calc(var(--dot) * var(--us));
    height: calc(var(--dot) * var(--us));
  }
  .simrow {
    display: flex;
    justify-content: center;
    gap: calc(var(--btn-gap) * 2 * var(--us));
  }
  .round {
    width: calc(var(--sim-d) * var(--us));
    height: calc(var(--sim-d) * var(--us));
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .round svg { width: 44%; height: 44%; }
  /* In the band the Simulation section can be narrower than two circles. */
  .app[data-plan="band"] .round {
    width: min(calc(var(--sim-d) * var(--us)), calc(50% - var(--btn-gap) * var(--us)));

    aspect-ratio: 1;
  }
  .reset {
    height: calc(var(--reset-h) * var(--us));
    gap: calc(6 * var(--us));
    font-size: calc(11 * var(--us));

  .reset svg { width: calc(16 * var(--us)); height: calc(16 * var(--us)); }

  /* PROPOSAL: one Play/Pause toggle, with Reset beside it on the same row
     -- a circle like the toggle, or a pill with its label. */
  .app .simtoggle,
  .app .reset-round,
  .app .reset-pill { display: none; }
  .app[data-simtoggle="on"] :is([data-act="play"], [data-act="pause"], .reset-under) { display: none; }
  .app[data-simtoggle="on"] .simtoggle { display: flex; }
  .app[data-simtoggle="on"][data-resetstyle="round"] .reset-round { display: flex; }
  .app[data-simtoggle="on"][data-resetstyle="pill"] .reset-pill { display: flex; }
  .reset-round svg { width: 40%; height: 40%; }
  .app .reset-pill {
    flex: 1 1 auto;
    min-width: 0;
    height: calc(var(--sim-d) * var(--us));
    border-radius: calc(var(--sim-d) * var(--us));

  .app[data-plan="band"] .reset-pill { height: auto; align-self: stretch; }

  /* PROPOSAL: Stamp and the Walls tool hidden (Walls becomes a swatch). */
  .app[data-nostamp="on"] .tool[data-i="4"],
  .app[data-wallsw="on"] .tool[data-i="3"] { display: none; }

  /* PROPOSAL: the band reads Tools, Sizes, Simulation. */
  .app[data-plan="band"][data-bandtsm="on"] .sec.tools { order: -1; }

  /* --- tool actions: in the bar, or in the tool box ------------------- */
  .act {
    flex: 1 1 0;
    min-height: 0;
    padding: 0 calc(6 * var(--u));
    font-size: calc(12 * var(--u));
    line-height: 1.2;
    text-align: center;
    border-radius: var(--r);
    background: color-mix(in srgb, var(--tint, transparent) 16%, var(--m-chrome2));
    border-color: color-mix(in srgb, var(--tint, var(--m-edge)) 45%, var(--m-edge));
  }
  .act.red { --tint: #e0524a; }
  .act.yellow { --tint: #e8c33d; }

  .boxacts {

    flex: 1 1 auto;

  .boxacts .act {

  .app[data-boxtool="1"] .boxacts[data-for="1"],
  .app[data-boxtool="2"] .boxacts[data-for="2"],
  .app[data-boxtool="3"] .boxacts[data-for="3"] { display: flex; }

  /* --- the swatch bar --------------------------------------------------
     For every tool but Brush, that tool's buttons cover the row instead;
     the row stays in the layout, invisible, so the bar keeps its height.
     data-show says which is up -- the app's `#bar[data-show]`. */
  .bar {
    grid-area: bar;
    position: relative;
    display: flex;
    min-width: 0;
    overflow: hidden;
    padding: calc(var(--bar-pad) * var(--u));

    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--r);
  }
  .swrow {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
  }
  .swatches {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .app[data-just="left"] :is(.swatches, .stamps) { justify-content: flex-start; }
  .app[data-just="spread"] .swatches { justify-content: space-evenly; }
  .bar:not([data-show="none"]) .swrow { visibility: hidden; }

  /* PROPOSAL: the bar SCROLLS rather than trimming to what fits. Drag it,
     or press an arrow; an arrow shows on each side there is more to see.
     Overflowing, the row starts at the left whatever the alignment --
     centring an overflowing row would put its start out of reach. */
  .app[data-swscroll="on"] .swatches {
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .app[data-swscroll="on"] .swatches::-webkit-scrollbar { display: none; }
  .bar[data-overflowing="true"] .swatches { justify-content: flex-start; }
  .swarrow {
    appearance: none;
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: calc(var(--sw-arrow-w) * var(--u));
    display: none;
    align-items: center;
    justify-content: center;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--m-ink);
  }
  .swarrow.l { left: 0; background: linear-gradient(to right, var(--m-chrome) 60%, transparent); }
  .swarrow.r { right: 0; background: linear-gradient(to left, var(--m-chrome) 60%, transparent); }
  .swrow[data-l="true"] .swarrow.l,
  .swrow[data-r="true"] .swarrow.r { display: flex; }
  .swarrow svg {
    width: 70%;
    max-height: calc(24 * var(--u));

  /* PROPOSAL: Walls as a swatch, leftmost. A grey circle with the wall
     glyph: walls draw greyscale on the canvas. */
  .wallsw .swb {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #8b9099;
    color: #16181d;
  }
  .wallsw .swb svg {
    width: 52%;
    height: 52%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .sw[hidden] { display: none; }
  .sw {
    flex: 0 0 auto;
    width: calc((var(--sw-d) + var(--sw-gap)) * var(--u));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(3 * var(--u));
  }
  .sw-name {
    font-size: calc(var(--sw-name-fs) * var(--u));

    appearance: none;
    width: calc(var(--sw-d) * var(--u));
    height: calc(var(--sw-d) * var(--u));

    padding: 0;
    margin: calc(4 * var(--u)) 0;
    background: var(--c);
    border: calc(2 * var(--u)) solid rgba(0, 0, 0, 0.35);
    cursor: pointer;
    box-sizing: border-box;
  }
  /* An empty swatch (Custom only) is an outline. */
  .sw[data-empty="true"] .swb { background: transparent; border: calc(2 * var(--u)) dashed var(--m-edge); }
  .sw[data-empty="true"] .sw-name { font-style: italic; }
  .sw[data-sel="true"] .swb {

  .acts {
    display: none;
    position: absolute;
    inset: calc((var(--bar-pad) + 4) * var(--u));
    gap: calc(max(var(--btn-gap), 4) * var(--u));
  }
  .bar[data-show="1"] .acts[data-for="1"],
  .bar[data-show="2"] .acts[data-for="2"],
  .bar[data-show="3"] .acts[data-for="3"],
  .bar[data-show="4"] .acts[data-for="4"] { display: flex; }

  /* Stamp: New stamp beside the leftmost stored stamp, the group centred.
     Stamps use the swatch circles and spacing, without names. */
  .acts[data-for="4"] { inset: calc(var(--bar-pad) * var(--u)); }
  .stamps {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    overflow: hidden;
  }
  .sgroup { display: flex; align-items: flex-end; }
  .newstamp {
    flex: 0 0 auto;
    align-self: stretch;
    margin: calc(4 * var(--u)) calc(4 * var(--u)) calc(4 * var(--u)) 0;
    padding: 0 calc(14 * var(--u));
    white-space: nowrap;
    background: var(--m-chrome2);
    border-color: var(--m-edge);
  }
  .st .sw-name { visibility: hidden; }
  .st .swb { background: var(--p); }

  /* --- Reset's confirm dialog (sand.html's #confirm) ------------------ */
  .confirm {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
  }
  .app[data-confirm="on"] .confirm { display: flex; }
  .confirm-panel {
    background: var(--m-chrome);
    border: var(--m-bw) solid var(--m-edge);
    border-radius: var(--r);
    width: min(calc(280 * var(--u)), calc(100% - 32px));
    box-sizing: border-box;
    padding: calc(14 * var(--u));
  }
  .confirm-title {
    margin: 0 0 calc(6 * var(--u));
    font-size: calc(var(--label-fs) * var(--u));
    letter-spacing: var(--m-lspace);
    text-transform: var(--m-lcase);
    color: var(--m-dim);
  }
  .confirm-text { margin: 0 0 calc(14 * var(--u)); font-size: calc(12 * var(--u)); }
  .confirm-actions { display: flex; justify-content: flex-end; gap: calc(var(--btn-gap) * var(--u)); }
  .confirm-actions .b {
    height: calc(32 * var(--u));
    padding: 0 calc(14 * var(--u));
    font-size: calc(11 * var(--u));
    border-radius: var(--r);
  }
  .confirm-actions .b.primary { background: var(--m-accent); color: var(--m-accent-ink); border-color: var(--m-accent); }

  /* --- overlays -------------------------------------------------------- */
  .safe { position: absolute; z-index: 20; pointer-events: none; display: none;
    background: repeating-linear-gradient(45deg, rgba(255, 70, 50, 0.28) 0 6px, rgba(255, 70, 50, 0.08) 6px 12px); }
  .app[data-safe="on"] .safe { display: block; }
  .safe.t { top: 0; left: 0; right: 0; height: var(--st); }
  .safe.b { bottom: 0; left: 0; right: 0; height: var(--sb); }
  .safe.l { top: 0; bottom: 0; left: 0; width: var(--sl); }
  .safe.r { top: 0; bottom: 0; right: 0; width: var(--sr); }
  .tgt.small { outline: 3px solid #ff3b30 !important; outline-offset: 1px; }
</style>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // Devices: the VISIBLE browser viewport in CSS px, not the screen, so
  // the browser's own bars are already subtracted. safe = [top, right,
  // bottom, left] insets for notches and home indicators.

  const DEVICES = [
    { id: 'desk', name: 'Desktop 1080p', w: 1920, h: 960, touch: false },
    { id: 'laptop', name: 'Laptop 16:10', w: 1440, h: 790, touch: false },
    { id: 'small', name: 'Small laptop', w: 1366, h: 657, touch: false },
    { id: 'ipadL', name: 'iPad, landscape', w: 1180, h: 760, touch: true },
    { id: 'ipadP', name: 'iPad, portrait', w: 820, h: 1100, touch: true },
    { id: 'iphone', name: 'iPhone 15 Pro', w: 393, h: 659, touch: true },
    { id: 'iphoneL', name: 'iPhone 15 Pro, landscape', w: 852, h: 360, touch: true, safe: [0, 59, 21, 59] },
    { id: 'se', name: 'iPhone SE', w: 375, h: 553, touch: true },
    { id: 'android', name: 'Android phone', w: 412, h: 790, touch: true },
    { id: 'custom', name: 'Custom', custom: true },
  ];

  // The four assignable worlds, with sandUi.ts's stand-in artwork, then
  // Custom's. The World menu lists the ASSIGNED ones row by row, Custom…
  // last; unassigned worlds take no space.
  const WORLDS = [
    { name: 'Garden', g: 'radial-gradient(circle at 35% 35%, #b7e07a, #3f8a4a 55%, #173a22)' },
    { name: 'Vortex', g: 'conic-gradient(from 0deg, #5fb0e8, #1b2f5c, #b78be0, #1b2f5c, #5fb0e8)' },
    { name: 'Hourglass', g: 'linear-gradient(160deg, #f0c078, #a5601a 50%, #3a2210)' },
    { name: 'Reef', g: 'radial-gradient(circle at 60% 40%, #f08a7a, #4fc3b8 55%, #103a44)' },
  ];
  const CUSTOM_ART = 'conic-gradient(from 45deg, #3a3f4a, #6b7280, #3a3f4a, #6b7280, #3a3f4a)';
  const CUSTOM_WORLD = -1;
  const TOOLS = ['Brush', 'Erase', 'Shove', 'Walls', 'Stamp'];
  // What the bar holds for each tool, by TOOLS index: [label, tint, act, i].
  // Brush shows the swatches; Stamp is built separately. Erase's middle
  // button is its Mode, labelled with the current mode.
  const ERASE_MODES = ['Walls+Particles', 'Particles', 'Walls'];
  const TOOL_ACTIONS = [
    null,
    [['Clear all particles', 'red', 'act'], ['Mode', 'yellow', 'emode'], ['Clear all walls', 'white', 'act']],
    [['Push', 'red', 'shove', 0], ['Pull', 'white', 'shove', 1]],
    [['Clear all walls', 'red', 'act'], ['Restore initial walls', 'white', 'act']],
    null,
  ];
  // Stand-ins for stored stamps.
  const STAMPS = [
    'radial-gradient(circle at 30% 35%, #e8a33d 0 18%, transparent 19%), radial-gradient(circle at 65% 60%, #5fb0e8 0 22%, transparent 23%), #1d2027',
    'repeating-linear-gradient(45deg, #7cc27a 0 5px, #1d2027 5px 11px)',
  ];
  // The brush-size dots, as sandUi.buildSizes draws them: 4 + 12·sqrt(r / largest)
  // over BRUSH_SIZES' radii 0.01, 0.025, 0.05, 0.1.
  const SIZES = [0.01, 0.025, 0.05, 0.1].map((r) => +(4 + 12 * Math.sqrt(r / 0.1)).toFixed(2));
  // Swatch names: the shipped configs. Colours as the app's defaults:
  // hue = slot × golden-ratio conjugate, saturation 0.8, value 1.
  const SWATCH_NAMES = [
    'Medusa', 'Crystal', 'Burbles', 'Tangle', 'Pebbles', 'Stringy', 'Weave', 'Pseudocrystal',
    'Blanket', 'BubbleBelt', 'Cars', 'Crystal2', 'Diversity', 'Ladders', 'Medley', 'Medley2',
    'Prow', 'Rippler', 'Segments', 'Starcrossed', 'Stars', 'Tension', 'Angles', 'Armas',
    'Asteroids', 'Barcode', 'Beads', 'Blocks', 'Bonds', 'Bridges', 'Brittlestar', 'Buttons',
    'Capsules', 'Cells', 'Chainlink', 'Chopper', 'Circ', 'Clump', 'Dunes', 'Eggs',
  ];
  const MAX_SWATCHES = 40; // palette.ts SLOT_COUNT
  function swatchColor(slot) {
    const h = (slot * 0.618033988749895) % 1;
    const s = 0.8;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = 1 - s, q = 1 - f * s, t = 1 - (1 - f) * s;
    const [r, g, b] = [[1, t, p], [q, 1, p], [p, 1, t], [p, q, 1], [t, p, 1], [1, p, q]][i % 6];
    const hex = (v) => Math.round(v * 255).toString(16).padStart(2, '0');
    return `#${hex(r)}${hex(g)}${hex(b)}`;
  }

  // sandUi.ts's glyphs.
  const ICON = {
    Brush: '<svg viewBox="0 0 24 24"><path d="M17 3l4 4-9 9-4-4z"/><path d="M8 12l4 4-2 3a4 4 0 01-5 1 4 4 0 001-5z"/></svg>',
    Erase: '<svg viewBox="0 0 24 24"><path d="M4 16l8-8a2 2 0 013 0l4 4a2 2 0 010 3l-5 5H7z"/><path d="M9 21h12"/></svg>',
    Shove: '<svg viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M8 8l4-4 4 4"/><path d="M8 16l4 4 4-4"/><path d="M3 12h4"/><path d="M17 12h4"/></svg>',
    Walls: '<svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M3 12h18"/><path d="M9 6v6"/><path d="M15 12v6"/></svg>',
    Stamp: '<svg viewBox="0 0 24 24"><path d="M8 3h8v5l2 4H6l2-4z"/><path d="M5 16h14v5H5z"/></svg>',
    left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path class="fill" d="M8 5.5v13l10.5-6.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path class="fill" d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>',
    reset: '<svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v4.5h4.5"/></svg>',
    menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    caret: '<svg viewBox="0 0 24 14"><path d="M6 4l6 6 6-6"/></svg>',
  };

  // ------------------------------------------------------------------
  // State
  //
  // THE APP: every layout value below is what the app ships, taken from
  // sand.html's :root tokens, sandUi.ts's constants and sandDefaults.json.
  // "Reset everything" comes back here. If the app moves, update APP --
  // and bump KEY so a stored bench does not mask the new values.
  // ------------------------------------------------------------------
  const APP = {
    // sand.html :root
    ui: 1.15, pad: 5, corner: 5,
    swD: 44, swGap: 5, swNameFs: 9, barPad: 0,
    sideW: 150, secPad: 10, btnGap: 4, labelFs: 9,
    toolH: 44, toolCols: 2, sizeH: 44, simD: 44, resetH: 44, boxH: 170,
    bandToolCols: 3, sizeW: 37,
    wbtnH: 30, wswD: 56, wswGap: 9, wswFs: 10, wlBg: 0.5,
    // sandUi.ts
    maxShare: 75, swFill: 50, swGapMax: 45, keepSidebar: true,
    // sandDefaults.json (session.visibleCount)
    swCount: 30,
    // behaviour, as built
    portraitPlan: 'band', overflow: 'scroll', swJustify: 'center', toolBox: true, sizesVert: false,
    skin: 'darkroom',
  };
  // The bench's own: what to show, and how. Not part of the app.
  const BENCH = {
    view: 'gallery', zoomMode: 'fit', previewH: 300, focus: 'iphone',
    drawerOpen: false, drawerW: 230,
    showStatus: true, icState: 'off', showConfirm: false, showSafe: true,
    flagTargets: true, minTarget: 44,
    swLoaded: 30, worldsAssigned: 4, wmenuOpen: true,
    devices: Object.fromEntries(DEVICES.map((d) => [d.id, d.id !== 'custom'])),
    customW: 1024, customH: 700, customTouch: false,
    sel: { world: CUSTOM_WORLD, tool: 0, size: 2, swatch: 0, stamp: 0, shove: 0, eraseMode: 0, playing: true },
  };
  // THE v1 PROPOSAL: changes not in the app yet, each its own switch, on by
  // default. Untick them all to see the app as shipped.
  const PROPOSAL = {
    hideStamp: true,      // Stamp is not in v1
    wallsSwatch: true,    // the Walls tool becomes the leftmost swatch
    simToggle: true,      // one Play/Pause toggle, Reset beside it
    resetStyle: 'round',  // ...as a circle, or a pill with its label
    bandTsm: true,        // the band reads Tools, Sizes, Simulation

  };
  // What "changed" is measured against: the app's layout plus the proposal.
  const BASELINE = { ...APP, ...PROPOSAL };
  const DEFAULTS = { ...APP, ...PROPOSAL, ...BENCH };

  const KEY = 'fluoddity-sand-layout-bench-v3';
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const o = JSON.parse(raw);
        return {
          ...clone(DEFAULTS), ...o,
          devices: { ...DEFAULTS.devices, ...(o.devices || {}) },
          sel: { ...DEFAULTS.sel, ...(o.sel || {}) },
        };
      }
    } catch (e) { /* storage unavailable: run on defaults */ }
    return clone(DEFAULTS);
  }
  let S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }

  // The mock's tokens: bench key -> sand.html :root name. The export writes

  const STRUCTURAL = new Set(['view', 'focus', 'customW', 'customH', 'customTouch', 'swCount', 'swLoaded',

  const groupsEl = document.getElementById('groups');

  function fmt(k, v) {
    if (k === 'ui') return v.toFixed(2) + '×';
    if (k === 'wlBg') return Math.round(v * 100) + '%';

  function rowHtml(it) {
    if (it.type === 'range') {
      return `<label class="row" for="c-${it.k}" data-row="${it.k}"><span class="rl">${it.label}</span>` +
        `<input type="range" id="c-${it.k}" data-k="${it.k}" min="${it.min}" max="${it.max}" step="${it.step}">` +
        `<output id="o-${it.k}"></output></label>`;
    }
    if (it.type === 'seg') {
      return `<div class="row seg-row" data-row="${it.k}"><span class="rl">${it.label}</span><div class="seg" role="group" aria-label="${it.label}">` +
        it.opts.map(([v, l]) => `<button type="button" data-seg="${it.k}" data-v="${v}">${l}</button>`).join('') +
        `</div></div>`;
    }
    if (it.type === 'check') {
      return `<label class="row chk" for="c-${it.k}" data-row="${it.k}"><input type="checkbox" id="c-${it.k}" data-k="${it.k}"><span class="rl">${it.label}</span></label>`;
    }
    if (it.type === 'device') {
      return `<label class="row chk" for="d-${it.id}"><input type="checkbox" id="d-${it.id}" data-dev="${it.id}"><span>${it.label}</span></label>`;
    }
    if (it.type === 'select') {
      return `<label class="row" for="c-${it.k}"><span class="rl">${it.label}</span><select id="c-${it.k}" data-k="${it.k}">` +
        DEVICES.map((d) => `<option value="${d.id}">${d.name}</option>`).join('') + `</select></label>`;
    }

  function renderControls() {
    groupsEl.innerHTML = GROUPS.map((g) =>
      `<details class="group"${g.open === false ? '' : ' open'}><summary>${g.title}</summary>` +
      `<div class="rows">${g.items.map(rowHtml).join('')}</div></details>`).join('') +
      `<details class="group" open><summary>Export</summary><div class="rows">` +
      `<p class="note">sand.html’s :root layout tokens and sandUi.ts’s constants, ready to paste, followed by what differs from the app.</p>` +
      `<textarea class="export" id="export" readonly aria-label="Exported settings"></textarea>` +

      `<p class="note">Reset everything returns every value to the defaults: the app as shipped, with the v1 proposal on.</p></div></details>`;

  function syncControls() {
    groupsEl.querySelectorAll('[data-k]').forEach((el) => {
      const k = el.dataset.k;
      if (el.type === 'checkbox') el.checked = !!S[k];

      if (out) out.textContent = fmt(k, S[k]);

    groupsEl.querySelectorAll('[data-seg]').forEach((b) => {
      b.setAttribute('aria-pressed', String(S[b.dataset.seg] === b.dataset.v));

    groupsEl.querySelectorAll('[data-dev]').forEach((el) => { el.checked = !!S.devices[el.dataset.dev]; });
    groupsEl.querySelectorAll('[data-row]').forEach((el) => {
      const k = el.dataset.row;
      el.dataset.changed = String(k in BASELINE && S[k] !== BASELINE[k]);
    });
  }

  function change(k, v) {
    S[k] = v;
    save();
    syncControls();
    if (STRUCTURAL.has(k)) rebuild(); else applyAll();
  }

  groupsEl.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.dev) { S.devices[el.dataset.dev] = el.checked; save(); rebuild(); return; }
    const k = el.dataset.k;
    if (!k) return;
    if (el.type === 'checkbox') change(k, el.checked);

      const fallback = () => { ta.focus(); ta.select(); e.target.textContent = 'Selected: press Ctrl+C'; };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
      return;
    }
    if (e.target.id === 'reset-all') {
      if (resetArmed) {
        clearTimeout(resetArmed); resetArmed = null;
        S = clone(DEFAULTS); save(); syncControls(); rebuild();
        e.target.textContent = 'Reset everything';
      } else {
        e.target.textContent = 'Click again to reset';
        resetArmed = setTimeout(() => { resetArmed = null; e.target.textContent = 'Reset everything'; }, 3000);
      }
    }
  });

  // ------------------------------------------------------------------

          (S.wallsSwatch

  /** The tool as shown: a hidden tool falls back to Brush. */
  function curTool() {
    const t = S.sel.tool;
    if (t === 4 && S.hideStamp) return 0;
    if (t === 3 && S.wallsSwatch) return 0;
    return t;
  }

  // --- the scrolling swatch bar ------------------------------------------
  /** Which arrows to show: one on each side with more to scroll to. */
  function updateArrows(app) {
    const row = app.querySelector('.swatches');
    const wrap = app.querySelector('.swrow');
    const on = S.swScroll;
    const max = row.scrollWidth - row.clientWidth;
    wrap.dataset.l = String(on && row.scrollLeft > 1);
    wrap.dataset.r = String(on && row.scrollLeft < max - 1);
  }
  /**
   * Arrows page the bar by its width less one swatch, so the swatch at the
   * edge stays in view as a landmark. A finger scrolls the bar natively;
   * the mouse drags it here, so the previews can be tried on a desktop. The
   * previews are scaled with a transform, so a drag is divided by the scale.
   */
  function wireSwatchScroll(app) {
    const row = app.querySelector('.swatches');
    row.addEventListener('scroll', () => updateArrows(app), { passive: true });
    app.querySelectorAll('.swarrow').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const ui = parseFloat(app.style.getPropertyValue('--ui')) || 1;
        const gap = parseFloat(app.querySelector('.bar').style.getPropertyValue('--sw-gap')) || S.swGap;
        const item = (S.swD + gap) * ui;
        row.scrollBy({ left: Number(btn.dataset.dir) * Math.max(row.clientWidth - item, item), behavior: 'smooth' });
      });
    });
    let drag = null;
    row.addEventListener('pointerdown', (e) => {
      if (!S.swScroll || e.pointerType !== 'mouse' || e.button !== 0) return;
      const scale = row.getBoundingClientRect().width / row.offsetWidth || 1;
      drag = { x: e.clientX, left: row.scrollLeft, scale, moved: false };
    });
    window.addEventListener('pointermove', (e) => {
      if (drag === null) return;
      const dx = (e.clientX - drag.x) / drag.scale;
      if (Math.abs(dx) > 4) drag.moved = true;
      if (drag.moved) row.scrollLeft = drag.left - dx;
    });
    window.addEventListener('pointerup', () => {
      if (drag !== null && drag.moved) {
        // The press that ends a drag is not a swatch click.
        const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        row.addEventListener('click', swallow, { capture: true, once: true });
        setTimeout(() => row.removeEventListener('click', swallow, { capture: true }), 0);
      }
      drag = null;
    });
  }

  function applySelection(app) {
    const sel = S.sel;
    const mark = (q, i) => app.querySelectorAll(q).forEach((el) => { el.dataset.sel = String(Number(el.dataset.i) === i); });
    mark('.wsw', sel.world);
    mark('.tool', curTool());
    mark('.size', sel.size);
    mark('.swatches > .sw', sel.swatch);
    mark('.st', sel.stamp);
    mark('.pp', sel.shove);
    app.querySelectorAll('[data-act="emode"]').forEach((el) => {
      el.textContent = `Mode: ${ERASE_MODES[sel.eraseMode] || ERASE_MODES[0]}`;
    });
    app.querySelector('[data-act="play"]').dataset.sel = String(sel.playing);
    app.querySelector('[data-act="pause"]').dataset.sel = String(!sel.playing);
    // The toggle shows what pressing it does: Pause while running.
    const toggle = app.querySelector('.simtoggle');
    toggle.innerHTML = sel.playing ? ICON.pause : ICON.play;
    toggle.setAttribute('aria-label', sel.playing ? 'Pause' : 'Play');
    app.querySelector('.h-tool').textContent = TOOLS[curTool()];
    app.querySelector('.status').textContent =
      (sel.playing ? 'running' : 'PAUSED — arrange, then SPACE') + '  ·  ~48,210 particles  ·  R restores';
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || !t.closest('.app') || t.disabled) return;
    const i = Number(t.dataset.i);
    switch (t.dataset.act) {
      case 'world': S.sel.world = i; S.wmenuOpen = false; syncControls(); break;
      case 'tool': S.sel.tool = i; break;
      case 'size': S.sel.size = i; break;
      case 'swatch': S.sel.swatch = i; S.sel.tool = 0; break;
      case 'play': S.sel.playing = true; break;
      case 'pause': S.sel.playing = false; break;
      case 'playpause': S.sel.playing = !S.sel.playing; break;
      // Reset shows its confirm dialog; either of the dialog's buttons puts it away.
      case 'reset': S.showConfirm = true; syncControls(); break;
      case 'confirm': S.showConfirm = false; syncControls(); break;
      case 'drawer': S.drawerOpen = !S.drawerOpen; syncControls(); break;
      case 'wmenu': S.wmenuOpen = !S.wmenuOpen; syncControls(); break;
      case 'stamp': S.sel.stamp = i; break;
      case 'shove': S.sel.shove = i; break;
      case 'emode': S.sel.eraseMode = ((S.sel.eraseMode || 0) + 1) % ERASE_MODES.length; break;
      case 'act': return; // one-shot actions: nothing to show in a mock
      default: return;
    }
    save();
    applyAll();
  });

  // ------------------------------------------------------------------
  // Layout of one instance: plan, fits, and the numbers under it.
  // sandUi.relayout's logic, at a given scale.
  // ------------------------------------------------------------------
  function layoutAt(inst, ui) {
    const { app, w, h, touch } = inst;
    // Per instance, so one screen can be scaled up without the others.
    app.style.setProperty('--ui', String(ui));
    app.style.width = w + 'px';
    app.style.height = h + 'px';
    const [st, sr, sb, sl] = inst.safe;
    app.style.setProperty('--st', st);
    app.style.setProperty('--sr', sr);
    app.style.setProperty('--sb', sb);
    app.style.setProperty('--sl', sl);

    const portrait = h > w;
    const plan = portrait ? S.portraitPlan : 'sidebar';
    const ds = app.dataset;
    ds.plan = plan;
    ds.drawer = S.drawerOpen ? 'open' : 'closed';
    ds.overflow = S.overflow;
    ds.skin = S.skin;
    ds.just = S.swJustify;
    ds.ic = S.icState;
    ds.confirm = S.showConfirm ? 'on' : 'off';
    ds.status = S.showStatus ? 'on' : 'off';
    ds.safe = S.showSafe ? 'on' : 'off';
    ds.wmenu = S.wmenuOpen ? 'open' : 'closed';
    ds.sizesvert = S.sizesVert ? 'on' : 'off';
    ds.nostamp = S.hideStamp ? 'on' : 'off';
    ds.wallsw = S.wallsSwatch ? 'on' : 'off';
    ds.simtoggle = S.simToggle ? 'on' : 'off';
    ds.resetstyle = S.resetStyle;
    ds.bandtsm = S.bandTsm ? 'on' : 'off';
    ds.swscroll = S.swScroll ? 'on' : 'off';
    applySelection(app);

    const side = app.querySelector('.side');
    app.style.setProperty('--side-fit', '1');

    // --- tool box: only if it fits under Simulation at this scale ---
    // Measured with the box down: the free space is the sidebar's height
    // minus where Simulation ends. offsetTop, not getBoundingClientRect,
    // because the previews are scaled with a transform.
    ds.box = 'off';
    const tool = curTool();
    const boxTool = tool >= 1 && tool <= 3 ? tool : 1;
    ds.boxtool = String(boxTool);
    app.querySelector('.box-lbl').textContent = TOOLS[boxTool];
    const sim = side.querySelector('.sec.sim');
    const contentBottom = sim.offsetTop + sim.offsetHeight - side.offsetTop;
    const boxFree = side.clientHeight - contentBottom;
    const boxNeed = (S.boxH + S.pad) * ui;
    const boxEligible = plan === 'sidebar' && S.toolBox;
    const boxFits = boxEligible && boxFree >= boxNeed;
    // Whether the sidebar scrolls without the box: the scale-up cap's test.
    const scrolls = plan !== 'band' && side.scrollHeight > side.clientHeight + 1;
    if (boxFits) ds.box = 'on';
    const boxOn = boxFits;

    // --- which bar is up: Brush the swatches, Stamp its own, the action
    // tools theirs unless the tool box holds them ---
    const bar = app.querySelector('.bar');
    bar.dataset.show = tool === 4 ? '4' : (tool >= 1 && tool <= 3 && !boxOn ? String(tool) : 'none');

    // --- sidebar fit: scroll, or (experiment) scale everything down ---
    let fit = 1;
    let hiddenPx = 0;
    if (plan !== 'band') {
      const avail = side.clientHeight;
      let natural = side.scrollHeight;
      if (S.overflow === 'scale') {
        for (let k = 0; k < 4 && natural > avail + 1; k++) {
          fit *= avail / natural;
          app.style.setProperty('--side-fit', fit.toFixed(4));
          natural = side.scrollHeight;
        }
      } else {
        hiddenPx = Math.max(0, natural - avail);
      }
    }

    // --- swatches: as many as fit, up to the count -- or, scrolling, all
    // of them, with the rest a drag or an arrow away ---
    const row = app.querySelector('.swatches');
    const barAvail = row.clientWidth;
    const items = [...row.children];
    const itemW = (S.swD + S.swGap) * ui;
    const fits = Math.max(1, Math.floor((barAvail + 0.5) / itemW));
    const visible = S.swScroll ? items.length : Math.min(items.length, fits);
    items.forEach((el, i) => { el.hidden = i >= visible; });
    const overflowing = S.swScroll && items.length > fits;
    bar.dataset.overflowing = String(overflowing);

    // --- spacing: if the swatches fill too little of the bar, widen the
    // gaps (up to the cap) until they fill the target share. Only ever
    // widens, so it cannot change how many fit. Stamps share the spacing.
    let gap = S.swGap;
    const fillTarget = (barAvail * S.swFill) / 100;
    const shown = Math.max(1, visible);
    if (!overflowing && S.swFill > 0 && S.swGapMax > gap && shown * (S.swD + gap) * ui < fillTarget) {
      const want = fillTarget / (shown * ui) - S.swD;
      gap = Math.min(S.swGapMax, Math.max(gap, want));
    }
    bar.style.setProperty('--sw-gap', String(gap));
    const fillPct = barAvail > 0 ? Math.round((shown * (S.swD + gap) * ui * 100) / barAvail) : 0;
    updateArrows(app);

    // --- canvas ---
    const canvas = app.querySelector('.canvas');
    const cw = canvas.offsetWidth;
    const ch = canvas.offsetHeight;
    const aspect = ch > 0 ? cw / ch : 0;
    app.querySelector('.dims').innerHTML =
      `${cw} × ${ch}<small>${aspect >= 1 ? aspect.toFixed(2) + ' : 1' : '1 : ' + (1 / aspect).toFixed(2)}</small>`;

    // --- touch targets ---
    let small = 0;
    const drawerHidden = plan === 'drawer' && !S.drawerOpen;
    app.querySelectorAll('.tgt').forEach((el) => {
      el.classList.remove('small');
      if (!touch || !S.flagTargets) return;
      // offsetParent is null for anything display:none, including inside it.
      if (el.disabled || el.offsetParent === null) return;
      if (drawerHidden && el.closest('.side')) return;
      // Under another tool the swatches are invisible placeholders.
      if (bar.dataset.show !== 'none' && el.closest('.swatches')) return;
      if (el.offsetWidth < S.minTarget - 0.5 || el.offsetHeight < S.minTarget - 0.5) {
        el.classList.add('small');
        small++;
      }
    });

    // --- chips ---
    const pct = Math.round((cw * ch) / (w * h) * 100);
    const chips = [
      ['', `${plan}`],
      ['', `canvas ${cw}×${ch} · ${pct}% of screen`],
    ];
    if (plan !== 'band') {
      if (S.overflow === 'scale' && fit < 0.999) chips.push(['warn', `sidebar scaled to ${Math.round(fit * 100)}%`]);
      else if (hiddenPx > 0) chips.push(['warn', `sidebar scrolls ${hiddenPx}px`]);
      else chips.push(['ok', 'sidebar fits']);
    }
    if (overflowing) {
      chips.push(['', `${items.length} swatches, ${fits} in view · bar scrolls`]);
    } else {
      chips.push(visible < items.length ? ['warn', `${visible} of ${items.length} swatches fit`] : ['ok', `${visible} swatches fit`]);
      chips.push(['', gap > S.swGap + 0.05
        ? `swatch spacing raised to ${Math.round(gap)} · fill ${fillPct}%`
        : `swatches fill ${fillPct}% of bar`]);
    }
    if (boxEligible) {
      chips.push(boxOn
        ? ['ok', 'tool box in sidebar']
        : ['', `tool box in bar: ${Math.max(0, Math.round(boxFree))} of ${Math.round(boxNeed)}px free`]);
    }
    if (touch && S.flagTargets) {
      chips.push(small > 0 ? ['warn', `${small} targets under ${S.minTarget}px`] : ['ok', `targets ≥ ${S.minTarget}px`]);
    }
    return { chips, plan, share: (cw * ch) / (w * h), boxFits, scrolls };
  }

  /**
   * Lay out one instance as sandUi.relayout does: raise the UI scale when
   * the canvas would take more than `maxShare` of the screen (the share only
   * falls as the scale rises, so bisection finds the smallest scale that
   * meets it, capped at 4x), and -- with "keeps the sidebar whole" -- cap
   * that at the largest scale that keeps a tool box that fitted, or a
   * sidebar that did not scroll.
   */
  function layoutInstance(inst) {
    const base = S.ui;
    let r = layoutAt(inst, base);
    const target = S.maxShare / 100;
    let note = null;
    if (S.maxShare < 100 && r.share > target) {
      const edge = (lo, hi, below) => {
        for (let k = 0; k < 12; k++) {
          const mid = (lo + hi) / 2;
          if (below(mid)) lo = mid;
          else hi = mid;
        }
        return [lo, hi];
      };
      let ui = edge(base, base * 4, (u) => layoutAt(inst, u).share > target)[1];
      note = `UI scale raised to ${ui.toFixed(2)}× for a ${S.maxShare}% canvas`;
      if (S.keepSidebar && r.plan === 'sidebar') {
        let keeps = null;
        let what = '';
        if (r.boxFits) { keeps = (u) => layoutAt(inst, u).boxFits; what = 'the tool box'; }
        else if (!r.scrolls) { keeps = (u) => !layoutAt(inst, u).scrolls; what = 'the sidebar unscrolled'; }
        if (keeps !== null && !keeps(ui)) {
          ui = edge(base, ui, keeps)[0];
          note = ui - base < 0.005
            ? `UI scale not raised: it would cost ${what}`
            : `UI scale raised to ${ui.toFixed(2)}×, capped to keep ${what}`;
        }
      }
      r = layoutAt(inst, ui);
      r.chips.splice(2, 0, ['', note]);
    }
    return r.chips.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join('');
  }

  // ------------------------------------------------------------------
  // Views
  // ------------------------------------------------------------------
  const gallery = document.getElementById('gallery');
  const live = document.getElementById('live');
  const readout = document.getElementById('live-readout');
  let insts = [];

  function devSize(d) {
    if (d.custom) return { w: S.customW, h: S.customH, touch: S.customTouch };
    return { w: d.w, h: d.h, touch: d.touch };
  }

  function rebuild() {
    document.body.dataset.view = S.view;
    gallery.innerHTML = '';
    live.innerHTML = '';
    readout.innerHTML = '';
    insts = [];

    if (S.view === 'live') {
      const app = buildApp();
      live.append(app);
      insts.push({
        app, live: true,
        safe: ['env(safe-area-inset-top, 0px)', 'env(safe-area-inset-right, 0px)',
               'env(safe-area-inset-bottom, 0px)', 'env(safe-area-inset-left, 0px)'],
      });
    } else {
      const list = S.view === 'focus'
        ? DEVICES.filter((d) => d.id === S.focus)
        : DEVICES.filter((d) => S.devices[d.id]);
      for (const d of list) {
        const { w, h, touch } = devSize(d);
        const card = document.createElement('figure');
        card.className = 'card';
        card.innerHTML =
          `<header><b>${d.name}</b><span>${w}×${h}${touch ? ' · touch' : ''}</span>` +
          (S.view === 'gallery' ? `<button class="btn" type="button" data-focus="${d.id}">Open</button>` : '') +
          `</header><div class="pv${touch ? ' touch' : ''}"></div><figcaption class="chips"></figcaption>`;
        const app = buildApp();
        card.querySelector('.pv').append(app);
        gallery.append(card);
        const px = d.safe || [0, 0, 0, 0];
        insts.push({ app, card, w, h, touch, safe: px.map((v) => v + 'px') });
      }
      if (list.length === 0) gallery.innerHTML = '<p class="note">No devices selected. Turn some on under Devices.</p>';
    }
    applyAll();
  }

  gallery.addEventListener('click', (e) => {
    const b = e.target.closest('[data-focus]');
    if (b) { S.focus = b.dataset.focus; change('view', 'focus'); }
  });

  function applyAll() {
    const root = document.documentElement;
    for (const [k, v] of Object.entries(VARS)) root.style.setProperty(v, String(S[k]));

    for (const inst of insts) {
      if (inst.live) {
        inst.w = live.clientWidth;
        inst.h = live.clientHeight;
        inst.touch = matchMedia('(pointer: coarse)').matches;
        readout.innerHTML = `<span class="chip">this screen ${inst.w}×${inst.h}</span>` + layoutInstance(inst);
        continue;
      }
      const chips = layoutInstance(inst);
      inst.card.querySelector('figcaption').innerHTML = chips;

      let scale;
      if (S.view === 'focus') {
        const availW = gallery.clientWidth - 8;
        const availH = Math.max(240, window.innerHeight - 170);
        scale = Math.min(availW / inst.w, availH / inst.h, 1);
      } else if (S.zoomMode === 'true') {
        scale = S.previewH / 1080;
      } else {
        scale = Math.min(S.previewH / inst.h, (S.previewH * 2.2) / inst.w);
      }
      const maxW = gallery.clientWidth - 8;
      if (inst.w * scale > maxW && maxW > 0) scale = maxW / inst.w;
      const pv = inst.card.querySelector('.pv');
      pv.style.width = Math.round(inst.w * scale) + 'px';
      pv.style.height = Math.round(inst.h * scale) + 'px';
      inst.app.style.transform = `scale(${scale})`;
    }
    document.getElementById('export').value = exportText();
  }

  // ------------------------------------------------------------------
  // Export: in the app's own shapes, so each part pastes where it lives.
  // ------------------------------------------------------------------
  // The tokens sand.html's :root states, in its order. --drawer-w is not
  // one: the app has no drawer.
  const TOKEN_ORDER = [
    ['ui', '--ui-base'], ['pad', '--pad'], ['corner', '--corner'],
    ['swD', '--sw-d'], ['swGap', '--sw-gap'], ['swNameFs', '--sw-name-fs'], ['barPad', '--bar-pad'],
    ['sideW', '--side-w'], ['secPad', '--sec-pad'], ['btnGap', '--btn-gap'], ['labelFs', '--label-fs'],
    ['toolH', '--tool-h'], ['toolCols', '--tool-cols'], ['sizeH', '--size-h'],
    ['simD', '--sim-d'], ['resetH', '--reset-h'], ['boxH', '--box-h'],
    ['bandToolCols', '--band-tool-cols'], ['sizeW', '--size-w'],
    ['wbtnH', '--wbtn-h'], ['wswD', '--wsw-d'], ['wswGap', '--wsw-gap'], ['wswFs', '--wsw-fs'], ['wlBg', '--wl-bg'],
  ];
  const LABELS = {};
  for (const g of GROUPS) for (const it of g.items) if (it.k) LABELS[it.k] = it.label;

  function exportText() {
    const tokens = TOKEN_ORDER.map(([k, name]) => `  ${name}: ${S[k]};`).join('\n');
    const behaviour = [
      `portrait: ${S.portraitPlan}`,
      `sidebar too tall: ${S.overflow}`,
      `swatches: ${S.swJustify}`,
      S.toolBox ? 'sidebar tool box when it fits' : 'no sidebar tool box',
      S.keepSidebar ? 'scale-up keeps the sidebar whole' : 'scale-up ignores the sidebar',
      S.sizesVert ? 'band sizes in one column' : 'band sizes in two columns',
      `look: ${S.skin}`,
    ];
    if (S.portraitPlan === 'drawer') behaviour.push(`drawer width ${S.drawerW}`);
    const proposal = [
      S.hideStamp && 'Stamp hidden',
      S.wallsSwatch && 'Walls is the leftmost swatch, not a tool',
      S.simToggle && `one Play/Pause toggle, Reset beside it as a ${S.resetStyle === 'pill' ? 'pill with its label' : 'circle'}`,
      S.bandTsm && 'band order Tools, Sizes, Simulation',
      S.swScroll && `swatch bar scrolls, arrows ${S.swArrowW} wide`,
    ].filter(Boolean);

    const changed = Object.keys(BASELINE)
      .filter((k) => S[k] !== BASELINE[k])
      .map((k) => `  ${LABELS[k] || k}: ${fmt(k, BASELINE[k])} → ${fmt(k, S[k])}`);

    return `/* sand.html :root -- layout tokens from the layout bench.\n` +
      `   Unitless CSS px at UI scale 1. */\n` +
      `:root {\n${tokens}\n}\n\n` +
      `// sandUi.ts\n` +
      `const CANVAS_MAX_SHARE = ${S.maxShare / 100};\n` +
      `const SWATCH_FILL = ${S.swFill / 100};\n` +
      `const SWATCH_GAP_MAX = ${S.swGapMax};\n\n` +
      `// sandDefaults.json, session\n` +
      `"visibleCount": ${S.swCount}\n\n` +
      `/* ${behaviour.join(' · ')} */\n\n` +
      (proposal.length === 0 ? '' : `/* v1 proposal (not in the app yet): ${proposal.join(' · ')} */\n\n`) +
      (changed.length === 0
        ? `/* Same as the defaults. */\n`
        : `/* Changed from the defaults:\n${changed.join('\n')}\n*/\n`);
  }

  // --- this-screen view: controls slide in over the mock ---
  document.getElementById('ctl-toggle').addEventListener('click', () => {
    document.body.classList.toggle('ctl-open');
  });

  let raf = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(applyAll);
  });

  renderControls();
  syncControls();
  rebuild();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyAll);
})();
</script>
</body>
</html>
