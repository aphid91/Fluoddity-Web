<!doctype html>
<html lang="en" data-theme="system7" data-layout="rail">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Relative, matching `base: './'` in vite.config.ts, so this page works at
         a subpath, at a custom domain and from `npm run preview` alike. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <title>Fluoddity Sand</title>
    <style>
      /* ==================================================================
         TOKENS

         Every comp is one block of custom properties and nothing else --
         see `theme.ts`. Components below style themselves THROUGH these
         names and never name a colour directly, which is what makes
         switching a comp an attribute swap on <html> rather than a
         rebuild.

         The one comp that is not purely visual is `compact`, which moves
         the furniture. Its rules key on `[data-layout='dock']` rather
         than on its id, so a later comp can adopt either arrangement
         without the CSS learning its name.
         ================================================================== */

      :root {
        color-scheme: dark;

        /* --- geometry, shared by every comp -------------------------
           The rail is wide enough for two tool buttons side by side WITH
           their labels -- 76px clipped "Erase" and "Walls" to four
           characters, which is exactly the kind of thing that only shows
           up on screen. Widened again with the 30% tool bump below. */
        --rail-w: 140px;
        /* Tool buttons, 30% up from the 44px they shipped at. */
        --tool-size: 57px;
        /* Swatch buttons, 25% up from 92x30. */
        --swatch-w: 115px;
        --swatch-h: 38px;
        --tray-h: auto;
        --gap: 8px;
        --pad: 10px;

        /* --- SYSTEM 7 (default): 1-bit, hard edges, inverted selection.
               No shadows and no rounding anywhere -- the whole character
               of the reference is that nothing is soft. ---------------- */
        --bg: #5f5f5f;
        --chrome: #ffffff;
        --chrome-2: #ffffff;
        --edge: #000000;
        --edge-soft: #000000;
        --ink: #000000;
        --ink-dim: #6b6b6b;
        --accent: #000000;
        --accent-ink: #ffffff;
        --sel-bg: #000000;
        --sel-ink: #ffffff;
        --sel-edge: #000000;
        --radius: 0px;
        --border: 2px;
        --shadow: none;
        --font: ui-monospace, "Chicago", "Geneva", Monaco, monospace;
        --font-label: var(--font);
        --label-spacing: 0.02em;
        --label-transform: none;
        --canvas-edge: #000000;
        --ic-line: #ffffff;
        --ic-ink: #ffffff;
        --ic-bg: rgba(0, 0, 0, 0.72);
      }

      /* --- DARKROOM: near-black ground, neutrals biased cool, one amber
             accent. Soft 1px edges and a little depth -- the opposite
             read from System 7 on every axis except the layout. -------- */
      :root[data-theme='darkroom'] {
        --bg: #0b0c0f;
        --chrome: #16181d;
        --chrome-2: #1d2027;
        --edge: #2a2e37;
        --edge-soft: #21242b;
        --ink: #d6d9e0;
        --ink-dim: #767c8a;
        --accent: #e8a33d;
        --accent-ink: #1a1305;
        --sel-bg: #2a2118;
        --sel-ink: #f0c078;
        --sel-edge: #e8a33d;
        --radius: 5px;
        --border: 1px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-label: var(--font);
        --label-spacing: 0.06em;
        --label-transform: uppercase;
        --canvas-edge: #2a2e37;
        --ic-line: #e8a33d;
        --ic-ink: #f0c078;
        --ic-bg: rgba(11, 12, 15, 0.86);
      }

      /* --- BLUEPRINT: indigo drafting paper, cyan hairlines, monospace
             labels. The chrome carries a faint grid, which is the one
             texture in any of the four. ------------------------------- */
      :root[data-theme='blueprint'] {
        --bg: #0a1020;
        --chrome: #121a2e;
        --chrome-2: #18223a;
        --edge: #2d4468;
        --edge-soft: #223451;
        --ink: #c4d6ec;
        --ink-dim: #6d86a8;
        --accent: #7fd4e8;
        --accent-ink: #06222c;
        --sel-bg: #123040;
        --sel-ink: #a8e8f6;
        --sel-edge: #7fd4e8;
        --radius: 2px;
        --border: 1px;
        --shadow: none;
        --font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --font-label: var(--font);
        --label-spacing: 0.1em;
        --label-transform: uppercase;
        --canvas-edge: #2d4468;
        --ic-line: #7fd4e8;
        --ic-ink: #a8e8f6;
        --ic-bg: rgba(10, 16, 32, 0.86);
      }

      /* --- COMPACT DOCK: the structural variant. Tokens close to
             Darkroom so the comparison is about the LAYOUT rather than
             about colour -- the whole point of this one is the
             arrangement, and changing both at once would make it
             impossible to judge either. ------------------------------- */
      :root[data-theme='compact'] {
        --bg: #101115;
        --chrome: #1a1c22;
        --chrome-2: #22252c;
        --edge: #32363f;
        --edge-soft: #282b33;
        --ink: #dcdfe6;
        --ink-dim: #7d838f;
        --accent: #5fb0e8;
        --accent-ink: #04161f;
        --sel-bg: #16303f;
        --sel-ink: #9fd6f5;
        --sel-edge: #5fb0e8;
        --radius: 4px;
        --border: 1px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-label: var(--font);
        --label-spacing: 0.05em;
        --label-transform: uppercase;
        --canvas-edge: #32363f;
        --ic-line: #5fb0e8;
        --ic-ink: #9fd6f5;
        --ic-bg: rgba(16, 17, 21, 0.86);
      }

      /* ==================================================================
         PAGE
         ================================================================== */

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 var(--font);
        overflow: hidden;
      }

      *:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ------------------------------------------------------------------
         THE SHELL

         A grid rather than a stack of `position: fixed` bars, which is
         what makes "the canvas occupies only the space the trail texture
         fills, and the UI does not overlap it" true BY CONSTRUCTION
         rather than by matching paddings to bar heights. The rail claims
         a column and the tray claims a row; the canvas cell is what is
         left, and the canvas is fitted inside it by aspect.
         ------------------------------------------------------------------ */
      #shell {
        display: grid;
        height: 100%;
        grid-template-columns: var(--rail-w) 1fr;
        grid-template-rows: 1fr auto;
        grid-template-areas:
          'rail stage'
          'tray tray';
        gap: var(--gap);
        padding: var(--gap);
        box-sizing: border-box;
      }

      /* The dock comp: one bottom strip, no rail column. The canvas gets
         the entire width above it. */
      :root[data-layout='dock'] #shell {
        grid-template-columns: 1fr;
        grid-template-areas:
          'stage'
          'tray';
      }

      :root[data-layout='dock'] #rail {
        display: none;
      }

      /* ------------------------------------------------------------------
         THE STAGE AND THE CANVAS

         `#stage` is the free area; `#app` is fitted inside it at the
         simulation's aspect by `sandUi.fitCanvas`. The canvas is sized in
         PIXELS by script rather than by `aspect-ratio` because the
         surface's ResizeObserver drives the WebGPU backing store off the
         element's real box -- so the element must settle at an exact size
         rather than at whatever a percentage resolves to mid-layout.
         ------------------------------------------------------------------ */
      #stage {
        grid-area: stage;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 0;
      }

      /* Shrink-wraps the canvas, so `position: absolute` overlays inside it
         measure against the picture rather than against the free area. */
      #canvas-wrap {
        position: relative;
        display: block;
        line-height: 0;
      }

      #app {
        display: block;
        background: #000;
        border: var(--border) solid var(--canvas-edge);
        box-sizing: border-box;
        /* The canvas handles its own gestures; without this the browser
           would pan and pinch the page instead of letting a drag paint. */
        touch-action: none;
      }

      /* EDITING INITIAL CONDITIONS. A dashed border rather than a tinted
         overlay: the scene underneath is the thing being judged, so the
         signal has to sit outside it. `outline` rather than `border` so
         it does not change the element's box -- a border swap here would
         resize the WebGPU backing store on every pause. */
      #app[data-editing='true'] {
        outline: 2px dashed var(--ic-line);
        outline-offset: 3px;
      }

      #ic-banner {
        position: absolute;
        /* Clear of the dashed edit outline, which sits 3px outside the
           canvas box -- at 10px the two collided. */
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        /* Roomy: at 4px/12px the text sat right on the rule. */
        padding: 8px 20px;
        background: var(--ic-bg);
        color: var(--ic-ink);
        border: var(--border) solid var(--ic-line);
        border-radius: var(--radius);
        font-family: var(--font-label);
        font-size: 11px;
        letter-spacing: var(--label-spacing);
        text-transform: var(--label-transform);
        white-space: nowrap;
        pointer-events: none;
        display: none;
        z-index: 3;
      }

      #ic-banner[data-visible='true'] {
        display: block;
      }

      /* Inside the canvas's own box rather than the stage's, so it cannot
         spill across the dashed edit border or under the rail -- the
         stage is wider than the canvas whenever the window is. */
      #sand-status {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 92%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        /* On its own plate. It sits over the picture, which is black at
           rest and anything at all once particles are painted -- dim grey
           text alone was unreadable against both. */
        padding: 2px 8px;
        border-radius: var(--radius);
        background: var(--ic-bg);
        font-size: 11px;
        line-height: 1.4;
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        z-index: 2;
      }

      /* ------------------------------------------------------------------
         PANELS -- the shared chrome of the rail and the tray
         ------------------------------------------------------------------ */
      .panel {
        background: var(--chrome);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        box-sizing: border-box;
      }

      :root[data-theme='blueprint'] .panel {
        /* The one texture in the set: drafting-paper grid, kept far enough
           down in contrast that it reads as paper rather than as content. */
        background-image:
          linear-gradient(var(--edge-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--edge-soft) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      .group-label {
        font-family: var(--font-label);
        font-size: 9px;
        letter-spacing: var(--label-spacing);
        text-transform: var(--label-transform);
        color: var(--ink-dim);
        padding: 0 2px 4px;
        user-select: none;
      }

      /* ------------------------------------------------------------------
         THE TOOL RAIL
         ------------------------------------------------------------------ */
      #rail {
        grid-area: rail;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        min-height: 0;
        overflow-y: auto;
      }

      .rail-block {
        padding: var(--pad);
      }

      #tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }

      /* ------------------------------------------------------------------
         THE WORLD SELECTOR. Three rows of two, matching the tool grid --
         which is what makes it read as a sibling of Tools rather than as a
         new kind of control.

         The buttons are WIDER AND SHORTER than a tool: a tool is an icon
         with a word under it, a world is a name that has to be legible at
         a glance. They share the grid and nothing else.
         ------------------------------------------------------------------ */
      #worlds {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }

      .world {
        min-width: 0;
        height: calc(var(--tool-size) * 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        background: var(--chrome-2);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        /* A long world name truncates rather than widening the rail, which
           would push the canvas over every time one was assigned. */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .world:hover:not([data-selected='true']):not([disabled]) {
        border-color: var(--accent);
      }

      .world[data-selected='true'] {
        background: var(--sel-bg);
        border-color: var(--sel-edge);
        color: var(--sel-ink);
      }

      /* Unassigned. Still drawn, so the panel keeps its shape and an author
         can see which buttons are free -- but plainly not a thing to press. */
      .world[disabled] {
        color: var(--ink-dim);
        opacity: 0.45;
        cursor: default;
        font-style: italic;
      }

      /* Assigned to a world that has since been deleted. Says what happened
         rather than silently reading as unassigned -- see `refreshWorlds`. */
      .world[data-missing='true'] {
        color: #d06060;
        border-style: dashed;
      }

      /* CUSTOM is the editable world, and the one the dev palette slider
         governs. Set apart so it does not read as a sixth preset. */
      .world[data-custom='true'] {
        font-style: italic;
      }

      .tool {
        width: var(--tool-size);
        height: var(--tool-size);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 0;
        background: var(--chrome-2);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .tool:hover:not([data-selected='true']) {
        border-color: var(--accent);
      }

      .tool[data-selected='true'] {
        background: var(--sel-bg);
        border-color: var(--sel-edge);
        color: var(--sel-ink);
      }

      /* System 7 selects by INVERTING, which is how the reference shows a
         chosen tool -- a coloured border would be an anachronism in a
         comp whose whole premise is one bit of colour. */
      :root[data-theme='system7'] .tool[data-selected='true'] {
        background: var(--sel-bg);
        color: var(--sel-ink);
      }

      :root[data-theme='system7'] .tool[data-selected='true'] .tool-icon {
        color: var(--sel-ink);
      }

      /* Stamp: declared, not built. Dimmed so the rail is honest about it
         without the button moving when it becomes real. */
      .tool[data-todo='true'] {
        opacity: 0.45;
      }

      .tool-icon {
        width: 26px;
        height: 26px;
        display: block;
        color: var(--ink);
        pointer-events: none;
      }

      .tool-name {
        font-family: var(--font-label);
        font-size: 9px;
        letter-spacing: var(--label-spacing);
        text-transform: var(--label-transform);
        pointer-events: none;
      }

      /* --- brush sizes ------------------------------------------------- */
      /* ONE VERTICAL COLUMN, so the five read as a ramp from smallest to
         largest. Wrapped into a grid they made an arbitrary 2-2-1 shape
         that said nothing about the ordering. */
      #sizes {
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        align-items: center;
      }

      .size {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: var(--chrome-2);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        cursor: pointer;
      }

      .size:hover:not([data-selected='true']) {
        border-color: var(--accent);
      }

      .size[data-selected='true'] {
        background: var(--sel-bg);
        border-color: var(--sel-edge);
      }

      .size span {
        display: block;
        border-radius: 50%;
        background: var(--ink);
        pointer-events: none;
      }

      .size[data-selected='true'] span {
        background: var(--sel-ink);
      }

      /* --- Strength: a DEV control, and deliberately plain -------------
         STACKED in the rail. Laid out as a row, the label took the width
         and crushed the field to a few pixels -- the label is two words
         and the rail is narrow, so they cannot share a line. */
      #strength {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 3px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--edge-soft);
        cursor: ew-resize;
        user-select: none;
      }

      #strength[data-disabled='true'] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #strength span {
        font-family: var(--font-label);
        font-size: 9px;
        letter-spacing: var(--label-spacing);
        text-transform: var(--label-transform);
        color: var(--ink-dim);
      }

      #strength input {
        width: 100%;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        padding: 1px 4px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* The spinner arrows would fight the drag gesture. */
      #strength input::-webkit-inner-spin-button,
      #strength input::-webkit-outer-spin-button {
        appearance: none;
        margin: 0;
      }

      /* ------------------------------------------------------------------
         THE SWATCH TRAY
         ------------------------------------------------------------------ */
      #tray {
        grid-area: tray;
        padding: var(--pad);
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 34vh;
      }

      #tray-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      #hint {
        font-size: 11px;
        color: var(--ink-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #clear {
        flex: none;
        background: var(--chrome-2);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        color: var(--ink-dim);
        font: inherit;
        font-size: 10px;
        padding: 2px 8px;
        cursor: pointer;
      }

      #clear:hover {
        color: var(--ink);
        border-color: var(--accent);
      }

      #swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        overflow-y: auto;
        min-height: 0;
      }

      .swatch {
        width: var(--swatch-w);
        height: var(--swatch-h);
        flex: none;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        background: var(--chrome-2);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        overflow: hidden;
        text-align: left;
      }

      .swatch:hover:not([data-selected='true']) {
        border-color: var(--accent);
      }

      /* THE ACTIVE SWATCH. A highlighted border, per the brief -- and in
         System 7 an inversion as well, since a border alone is not a
         strong enough signal when every border is already black. */
      .swatch[data-selected='true'] {
        background: var(--sel-bg);
        border-color: var(--sel-edge);
        color: var(--sel-ink);
        box-shadow: inset 0 0 0 1px var(--sel-edge);
      }

      /* THE MASTER SWATCH. It grounds the world's trail settings, so it is
         marked -- and it is the one swatch the load menu offers no "None"
         for. A left edge rule rather than a full border, so "master" and
         "selected" can both be visible at once. */
      .swatch[data-master='true'] {
        border-left-width: 4px;
        border-left-color: var(--accent);
      }

      .swatch[data-empty='true'] .swatch-name {
        color: var(--ink-dim);
        font-style: italic;
      }

      .swatch-key {
        flex: none;
        font-size: 9px;
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
        min-width: 6px;
      }

      .swatch[data-selected='true'] .swatch-key {
        color: var(--sel-ink);
      }

      .swatch-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ------------------------------------------------------------------
         THE DOCK LAYOUT

         The structural comp. Tools, sizes, Strength and swatches all live
         in the tray as one horizontal strip; the rail is hidden entirely
         and the canvas takes the full width. The DOM is unchanged -- only
         which container the script parents the tool and size groups into,
         which `sandUi.applyLayout` does.
         ------------------------------------------------------------------ */
      :root[data-layout='dock'] #tray {
        flex-direction: row;
        align-items: stretch;
        gap: 10px;
        max-height: 26vh;
      }

      :root[data-layout='dock'] #dock-tools {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex: none;
      }

      :root[data-layout='dock'] #tools {
        grid-template-columns: repeat(5, var(--tool-size));
        align-content: center;
      }

      /* The dock is a short strip, so the size ramp goes back to a row
         here -- a vertical column of five would set the dock's height. */
      :root[data-layout='dock'] #sizes {
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: center;
      }

      :root[data-layout='dock'] #strength {
        margin-top: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        justify-content: center;
      }

      :root[data-layout='dock'] #strength input {
        width: 64px;
      }

      :root[data-layout='dock'] #tray-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }

      /* Two rows that scroll, rather than one row that wraps forever --
         the dock is short by design, so the swatches have to be dense. */
      :root[data-layout='dock'] #swatches {
        align-content: flex-start;
      }

      :root[data-layout='dock'] .swatch {
        width: 98px;
        height: 33px;
      }

      .dock-divider {
        display: none;
      }

      :root[data-layout='dock'] .dock-divider {
        display: block;
        width: var(--border);
        background: var(--edge);
        flex: none;
      }

      /* In the rail layout the dock wrapper is transparent -- the rail
         blocks provide their own chrome. */
      #dock-tools {
        display: contents;
      }

      #tray-body {
        display: contents;
      }

      /* ------------------------------------------------------------------
         THE LOAD MENU -- right-click a swatch. A dev surface; style is
         deliberately minimal.
         ------------------------------------------------------------------ */
      #loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      #loader[data-open='true'] {
        display: flex;
      }

      .loader-panel {
        background: var(--chrome);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius);
        width: min(520px, 92vw);
        max-height: 72vh;
        overflow: auto;
        padding: 12px 14px;
      }

      .loader-panel h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }

      .loader-panel h3 {
        margin: 10px 0 4px;
        font-size: 10px;
        font-family: var(--font-label);
        letter-spacing: var(--label-spacing);
        text-transform: uppercase;
        color: var(--ink-dim);
      }

      .entry {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        border-radius: var(--radius);
        color: var(--ink);
        padding: 3px 6px;
        cursor: pointer;
        font: inherit;
      }

      .entry:hover {
        background: var(--chrome-2);
        border-color: var(--edge);
      }

      /* "None" -- clears the swatch. Set apart from the configs because it
         is the only destructive row in the list. */
      .entry[data-none='true'] {
        color: var(--ink-dim);
        font-style: italic;
        border-bottom: 1px solid var(--edge-soft);
        border-radius: 0;
        margin-bottom: 6px;
        padding-bottom: 6px;
      }

      /* Compatible with the master element's world settings -- see
         compatibility.ts. Green means "this will look like it should here". */
      .entry[data-compatible='true'] {
        color: #6ee08a;
      }

      .loader-hint {
        margin-top: 10px;
        color: var(--ink-dim);
        font-size: 11px;
      }

      /* ------------------------------------------------------------------
         THE WORLD LOADER. The same modal shell as #loader, reusing every
         token -- it is the same gesture aimed at a different library, and
         two dialogs that look different for no reason would read as two
         unrelated features.

         What differs is one thing: a row here is a NAME PLUS AN X, because
         a saved world can be deleted and a shipped config cannot. That is
         why the row is a flex container rather than a bare button.
         ------------------------------------------------------------------ */
      #world-loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }

      #world-loader[data-open='true'] {
        display: flex;
      }

      /* THE ROW IS THE HIT AREA, not the name span. Padding gutters that
         show `cursor: pointer` and then do nothing when clicked are the
         bug `menuBar.browserRow` documents; the row listens, and the X
         stops propagation so it cannot load what it is deleting. */
      .world-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 3px 6px;
        cursor: pointer;
      }

      .world-row:hover {
        background: var(--chrome-2);
        border-color: var(--edge);
      }

      .world-row-name {
        flex: 1;
        text-align: left;
        color: var(--ink);
        font: inherit;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The same muted red the studio's File > Load uses. A delete is the
         one irreversible thing in this list and should not read as neutral
         furniture. */
      .world-row-delete {
        background: transparent;
        border: 0;
        color: #d06060;
        cursor: pointer;
        font: 12px var(--font-label), system-ui, sans-serif;
        padding: 0 4px;
        line-height: 1;
      }

      .world-row-delete:hover {
        color: #ff8080;
      }

      .world-empty {
        color: var(--ink-dim);
        font-style: italic;
        font-size: 11px;
        padding: 6px 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <!-- THE TOOL RAIL. Hidden by the dock comp, which re-parents these
           two blocks into the tray -- see `sandUi.applyLayout`. -->
      <div id="rail">
        <!-- ABOVE TOOLS, because picking a world precedes picking a brush:
             it decides what the palette and the scene even are. -->
        <div class="panel rail-block" id="rail-worlds">
          <div class="group-label">Select World</div>
          <div id="worlds"></div>
        </div>
        <div class="panel rail-block" id="rail-tools">
          <div class="group-label">Tools</div>
          <div id="tools"></div>
        </div>
        <div class="panel rail-block" id="rail-sizes">
          <div class="group-label">Size</div>
          <div id="sizes"></div>
          <!-- Strength is a DEV control being dialled in constantly, so it
               sits with the size buttons rather than in the panel. Its
               value is per-tool; the label says which. -->
          <label id="strength" title="Drag to scrub. Per tool.">
            <span id="strength-label">Strength</span>
            <input type="number" id="strength-input" step="0.1" value="1" />
          </label>
        </div>
      </div>

      <div id="stage">
        <!-- The overlays anchor to the CANVAS, not the stage: the stage is
             the free area and is wider than the canvas whenever the window
             is, so a banner centred on it would sit off-picture. -->
        <div id="canvas-wrap">
          <canvas id="app"></canvas>
          <div id="ic-banner">Editing Initial Conditions</div>
          <div id="sand-status"></div>
        </div>
      </div>

      <div class="panel" id="tray">
        <!-- The dock comp packs these two wrappers side by side; in the
             rail layout they are `display: contents` and contribute no box
             of their own. -->
        <div id="dock-tools"></div>
        <div class="dock-divider"></div>
        <div id="tray-body">
          <div id="tray-head">
            <span id="hint"></span>
            <button type="button" id="clear"></button>
          </div>
          <div id="swatches"></div>
        </div>
      </div>
    </div>

    <div id="loader">
      <div class="loader-panel">
        <h2>Load into swatch <span id="loader-slot"></span></h2>
        <div id="loader-list"></div>
        <div class="loader-hint">
          Green entries are compatible with the master element's trail
          persistence. Esc to cancel.
        </div>
      </div>
    </div>

    <!-- The world library. Dev-only for now: opened by "Load world" on the
         Dev tab, and the place worlds are deleted from. -->
    <div id="world-loader">
      <div class="loader-panel">
        <h2 id="world-loader-title">Load world</h2>
        <div id="world-loader-list"></div>
        <div class="loader-hint">
          Loading a world replaces the palette, the preferences and the
          initial conditions. Esc to cancel.
        </div>
      </div>
    </div>

    <script type="module" src="/src/sand/main.ts"></script>
  </body>
</html>
